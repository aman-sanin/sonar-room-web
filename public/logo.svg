<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<style type="text/css">
  .ring {
    fill: none;
    stroke: #FFFFFF;
    stroke-width: 1.4;
    opacity: 0.9;
  }
  .core {
    fill: #FFFFFF;
  }
  .pulse {
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
</style>

<g>
  <circle class="ring" cx="15" cy="15" r="12"/>
  <circle class="ring pulse" cx="15" cy="15" r="8"/>
  <circle class="ring" cx="15" cy="15" r="4"/>
  <circle class="core" cx="15" cy="15" r="1.8"/>
</g>
</svg>
